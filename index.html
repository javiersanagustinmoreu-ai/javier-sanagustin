<style>
/* Cada obra a sangre, recortada con punto de interés propio. Nombre y menú encima, que cambian de blanco a tinta según la imagen.
   El color de la obra vive en la etiqueta inferior, donde una margarita marca el tiempo que queda. */
:root{
  --canvas:#e6e6e3;
  --ink:#141412;
  --veil:rgba(247,247,245,.62);
  --fgnow:#ffffff;
  --shade:0 1px 14px rgba(0,0,0,.38);
  --label:#716832;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pad:clamp(16px,3vw,40px);
  --gutter-l:max(var(--pad),env(safe-area-inset-left,0px));
  --gutter-r:max(var(--pad),env(safe-area-inset-right,0px));
  color-scheme:light;
}
html{scroll-snap-type:none}html.snap{scroll-snap-type:y proximity}
body{margin:0;min-height:100%;background:#f4f0ec;color:var(--ink);font:400 1rem/1.4 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;box-shadow:0 0 0 4px var(--ink)}

/* Entrada: la frase se escribe y al final brota la flor. Vídeo sobre blanco puro, fundido con el lienzo por multiplicación. */
.intro{scroll-snap-align:start;position:relative;padding:72px var(--gutter-r) 14px var(--gutter-l);background:#f4f0ec url("img/papel.jpg") center/cover no-repeat}
/* la flor es una capa propia: nace al final de la frase y se queda por encima de las obras */
.flower{position:fixed;left:0;top:0;z-index:6;pointer-events:none;filter:drop-shadow(0 0 3px var(--fhalo,transparent)) drop-shadow(0 0 12px var(--fhalo,transparent))}
.intro video,.intro .still{display:block;width:100%;height:auto;mix-blend-mode:multiply;filter:url(#tint)}
.intro .still{display:none}
.ph{position:relative}.ph canvas{display:none;position:absolute;left:0;top:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.intro.cv canvas{display:block}.intro.cv video,.intro.cv .still{opacity:0;filter:none;mix-blend-mode:normal}
.intro.static video{display:none}.intro.static .still{display:block}
.carousel{position:relative;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start}
html.onintro{--fgnow:#141412;--namecol:#141412;--shade:none}
.stage{position:absolute;inset:0}
.slide{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
.slide.on{opacity:1}
.slide img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}
@media (min-aspect-ratio:1/1){.slide img{object-position:var(--posd,var(--pos,50% 50%))}}

.veil{position:absolute;inset:0;background:var(--veil);opacity:0;transition:opacity .35s ease;pointer-events:none;z-index:3}
html.veiled .veil{opacity:1}

header{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;
  padding:calc(var(--pad) * .7 + env(safe-area-inset-top,0px)) var(--gutter-r) 1.2rem var(--gutter-l);
  color:var(--fgnow);text-shadow:var(--shade);transition:color .6s ease}
.name{margin:0;font:800 clamp(1.7rem,3.6vw,3.4rem)/.92 var(--display);letter-spacing:-.025em;max-width:9em;color:var(--namecol,inherit);text-shadow:var(--nshade,var(--shade));transition:color .8s ease}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.35rem 1.6rem;max-width:58rem}
nav a{display:block;padding:.35rem 0;color:inherit;text-decoration:none;font-weight:500;font-size:.98rem;letter-spacing:.02em;border-bottom:1px solid transparent}
nav a:hover,nav a:focus-visible{border-bottom-color:currentColor}
.menu-btn{display:none;background:none;border:1px solid currentColor;padding:.45rem .9rem;cursor:pointer;font-weight:500;letter-spacing:.04em;text-shadow:inherit}

.arrow{position:absolute;top:50%;translate:0 -50%;z-index:4;width:48px;height:48px;border:0;border-radius:50%;
  background:rgba(247,247,245,.72);color:var(--ink);cursor:pointer;display:grid;place-items:center;opacity:.55;transition:opacity .25s,background .25s}
.arrow:hover,.arrow:focus-visible{opacity:1;background:rgba(247,247,245,.96)}
.arrow svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prev{left:max(10px,env(safe-area-inset-left,0px))}
.next{right:max(10px,env(safe-area-inset-right,0px))}

footer{position:absolute;inset:auto 0 0 0;z-index:4;display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:flex-end;gap:1rem;
  padding:0 var(--gutter-r) calc(var(--pad) * .7 + env(safe-area-inset-bottom,0px)) var(--gutter-l);pointer-events:none}
.label{display:flex;align-items:center;gap:.8rem;min-width:0;background:rgba(247,247,245,.94);color:var(--ink);padding:.55rem 1rem .55rem .7rem}
a.label{text-decoration:none;cursor:pointer;pointer-events:auto}.label .go{display:block;margin-top:.2rem;font-size:.8rem;opacity:.62;letter-spacing:.01em;transition:opacity .2s}a.label:hover .go,a.label:focus-visible .go{opacity:1;text-decoration:underline}a.label:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.label b{font-weight:600}
.label span{opacity:.72}
.label .txt{min-width:0;font-size:.95rem;line-height:1.3}
.label{max-width:min(34rem,calc(100vw - 9.5rem))}
.label .t span{opacity:.72}
.label .q{margin-top:.15rem;font-style:italic}
.count{font-variant-numeric:tabular-nums;font-size:.9rem;letter-spacing:.06em;color:#fff;background:rgba(20,20,18,.66);padding:.4rem .7rem;white-space:nowrap}

/* margarita-reloj: un pétalo por cada trozo de tiempo; se reinicia con cada obra */
.daisy{width:38px;height:38px;flex:none;overflow:visible}
.daisy .p{fill:var(--petal);transition:fill .8s ease;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.daisy .c{fill:#f2c94c}
.daisy.run .p{animation:petal .45s ease-out forwards;animation-delay:calc(var(--k) * var(--step,540ms))}
.daisy.static .p{opacity:1}
@keyframes petal{from{opacity:0;transform:rotate(var(--r)) scale(.15)}to{opacity:1;transform:rotate(var(--r)) scale(1)}}
html.paused .daisy.run .p{animation-play-state:paused}
.daisy .c{stroke:rgba(20,20,18,.25);stroke-width:.6}

@media (max-width:760px){
  .intro{padding:56px 10px 10px}
  .menu-btn{display:inline-block}
  html:not(.onintro):not(.veiled):not(.menu-open) .menu-btn{color:var(--btncol,currentColor);border-color:var(--btncol,currentColor)}
  nav ul{position:fixed;inset:0;z-index:7;background:rgba(244,240,236,.98);flex-direction:column;justify-content:center;align-items:flex-start;gap:.6rem;padding:0 var(--gutter-l);max-width:none;display:none;color:var(--ink);text-shadow:none}
  nav ul a{font:700 2rem/1.15 var(--display);letter-spacing:-.01em}
  .soc-li{position:relative;align-self:stretch;justify-content:flex-end}.soc-li::after{content:"";position:absolute;right:calc(44px - var(--gutter-l));bottom:calc(100% - 1.2rem + 4px);height:min(17vh,170px);width:calc(min(17vh,170px) * .36);background:url(img/flor-marca.png) no-repeat center bottom/contain;pointer-events:none}
  html.menu-open nav ul{display:flex}
  html.menu-open footer,html.menu-open .arrow,html.menu-open .soc,html.menu-open .flower{visibility:hidden}
  html.menu-open .menu-btn{position:relative;z-index:8}
  .arrow{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){.slide{transition:none}header,.label{transition:none}}
#menuList li.lang a{font-size:.85rem;letter-spacing:.1em;opacity:.7}
/* iconos de contacto */
.soc{position:fixed;left:var(--gutter-l,40px);bottom:16px;z-index:5;display:none;flex-direction:row;gap:12px;color:var(--fgnow,#141412)}
.soc{bottom:82px;left:34px}.soc a,.soc-li a{display:grid;place-items:center;width:28px;height:28px;color:inherit;opacity:.72;transition:opacity .2s,transform .2s}
.soc a:hover,.soc a:focus-visible,.soc-li a:hover{opacity:1;transform:translateY(-1px)}
.soc svg,.soc-li svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soc-li{display:flex;gap:18px;padding-top:1.2rem}
@media (min-width:761px){.soc{display:flex}.soc-li{display:none}}
@media (max-width:760px){.soc{display:flex;flex-direction:column;gap:2px;left:8px;bottom:58px}}
@media (min-width:761px) and (max-width:1020px){header nav ul{gap:1rem}header nav ul a{font-size:.92rem}}
@media (min-width:761px) and (max-width:900px){header nav ul{gap:.35rem .8rem}header nav ul a{font-size:.84rem}header .name{font-size:clamp(1.3rem,3.6vw,1.7rem)}}
</style>
